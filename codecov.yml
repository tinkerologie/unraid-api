codecov:
  require_ci_to_pass: false

  strict_yaml_branch: main
  notify:
    wait_for_ci: false
coverage:
  precision: 2
  round: down
  range: "90...100"
  status:
    project:
      default:
        target: 95%
        threshold: 0%
    patch:
      default:
        target: 95%
        threshold: 0%

        informational: false
        if_not_found: failure
comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: false
github_checks: false
