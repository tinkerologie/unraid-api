name: Bug report
description: Report a reproducible bug, defect, or regression.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use this form to report a bug you can reproduce. Contributors or CodeRabbit AI (@coderabbitai plan) can use your report to make a plan.
  - type: dropdown
    id: affected-area
    attributes:
      label: Affected area
      description: Which part of the project has the problem?
      options:
        - Client and HTTP transport
        - Authentication and tokens
        - Endpoints and resource models
        - Data serialization and DTOs
        - Exceptions and error handling
        - Type annotations and typing
        - Documentation
        - CI and repository automation
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Package version
      description: What package version are you running?
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      description: What Python version are you using?
      placeholder: "3.12.0"
    validations:
      required: true
  - type: input
    id: environment-version
    attributes:
      label: Environment details
      description: Operating system, virtual environment manager, or related dependency versions (if applicable).
      placeholder: "e.g. Linux x86_64, macOS 15, uv / poetry"
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what happened. Then describe what you expected.
      placeholder: Give the result you got and the result you expected.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: List the steps to reproduce the problem. Include only the necessary steps.
      placeholder: |
        1. Go to ...
        2. Trigger ...
        3. Observe error ...
    validations:
      required: true
  - type: textarea
    id: relevant-logs
    attributes:
      label: Relevant log output and tracebacks
      description: Remove credentials and tokens. Paste the applicable logs, stack traces, or terminal output.
      render: shell
    validations:
      required: false
  - type: textarea
    id: root-cause-or-proposal
    attributes:
      label: Root cause analysis or proposed fix
      description: If you know which files or functions cause the problem, list them. Describe a possible correction for CodeRabbit.
      placeholder: Suspect files, functions, or potential code resolution (if known).
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add screenshots, diagnostics exports, related pull requests, or environment context.
      placeholder: Any extra context to help reproduce and resolve.
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Pre-submission confirmations
      options:
        - label: I searched existing open and closed issues before opening this bug report.
          required: true
        - label: I confirm this issue targets the unraid-api Python package.
          required: true
        - label: I confirmed that no sensitive credentials (passwords, auth tokens, private keys) are included in this report.
          required: true
        - label: I read and agree to follow repository contribution rules and guidelines.
          required: true
